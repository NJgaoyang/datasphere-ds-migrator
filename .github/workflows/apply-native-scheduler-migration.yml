name: Apply Native Scheduler Migration Refactor

on:
  push:
    paths:
      - '.github/workflows/apply-native-scheduler-migration.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/native-scheduler-production-migration
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply migration refactor
        run: python3 scripts/apply_native_scheduler_migration_patch.py

      - name: Verify no legacy development schedule migration remains
        run: |
          ! grep -R "saveDevelopmentSchedule" -n src/main/java src/test/java
          ! grep -R "DEV_FLOW_SCHEDULE\|isDevelopmentOnlyWorkflow" -n src/main/java src/test/java
          grep -n "Native Scheduler" README.md

      - name: Run targeted backend tests
        run: mvn -q -Dtest=MigrationServiceTest,DolphinScheduler319ReaderTest test

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md frontend/src/App.vue src/main/java/com/company/migrator/service/MigrationService.java src/main/java/com/company/migrator/target/DataSphereClient.java src/test/java/com/company/migrator/service/MigrationServiceTest.java
          git diff --cached --check
          git commit -m "feat: migrate workflows to native scheduler"
          git push origin HEAD:feat/native-scheduler-production-migration
