name: Apply Native DEPENDENT Migration

on:
  push:
    paths:
      - '.github/workflows/apply-native-dependent-migration.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/native-dependent-migration
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply patch
        run: python3 scripts/apply_native_dependent_migration_patch.py
      - name: Verify duplicate schedule path stays removed
        run: |
          ! grep -R 'saveDevelopmentSchedule' -n src/main/java src/test/java
          ! grep -R 'DEV_FLOW_SCHEDULE' -n src/main/java src/test/java
          grep -R 'saveWorkflowDependency' -n src/main/java
          grep -R 'DEPENDENT 已迁为 disabled' -n src/main/java
      - name: Run targeted backend tests
        run: mvn -q -Dtest=MigrationServiceTest,DolphinSchedulerDependentMapperTest,DolphinScheduler319ReaderTest test
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/main/java/com/company/migrator/service/MigrationService.java src/main/java/com/company/migrator/target/DataSphereClient.java src/test/java/com/company/migrator/service/DolphinSchedulerDependentMapperTest.java
          git diff --cached --check
          git commit -m 'feat: migrate dependent gates to workflow dependencies'
          git push origin HEAD:feat/native-dependent-migration
